name: Tests

on: [push, pull_request]

jobs:
  tests:
    name: 🧪 Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15', 'pypy3.10', 'pypy3.11']

    steps:
      - name: Checkout project
        id: checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}

      - name: Install tox and plugins
        id: install-tox
        run: |
          uv pip install --system tox tox-uv tox-gh-actions

      - name: Run unit tests with tox
        id: test
        run: tox

      - name: Check that the package works without extra dependencies
        id: check-install
        run: |
          uv venv --python ${{ matrix.python-version }} /tmp/check-install
          uv pip install --python /tmp/check-install/bin/python .
          /tmp/check-install/bin/python -c "import graphql; print(graphql.version)"
